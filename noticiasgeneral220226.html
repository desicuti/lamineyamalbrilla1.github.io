<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias Lamine Yamal - 22/02/26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --azul-barca: #004d98;
            --grana-barca: #a50044;
            --dorado: #edbb00;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            color: var(--blanco);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fecha-destacada {
            color: var(--dorado);
            display: block;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .img-boton {
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: transform 0.3s;
            border: 2px solid rgba(237, 187, 0, 0.3);
        }

        .contenedor-enlace {
            text-decoration: none;
            display: block;
            margin-bottom: 2.5rem;
        }

        .contenedor-enlace:hover .img-boton {
            transform: scale(1.03);
        }

        .btn-noticias {
            display: inline-block;
            background: linear-gradient(45deg, var(--azul-barca), var(--grana-barca));
            color: white;
            padding: 18px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(165, 0, 68, 0.3);
            line-height: 1.4;
            width: 80%;
        }

        .contenedor-enlace:hover .btn-noticias {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(165, 0, 68, 0.5);
        }

        .video-section {
            margin-bottom: 2.5rem;
        }

        .video-thumbnail-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--dorado);
            transition: transform 0.3s;
        }

        .video-thumbnail-container img {
            width: 100%;
            display: block;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            color: white;
            transition: background 0.3s;
        }

        .video-thumbnail-container:hover {
            transform: scale(1.03);
        }

        .video-thumbnail-container:hover .play-overlay {
            background: rgba(0, 0, 0, 0.1);
        }

        .video-caption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--dorado);
            font-style: italic;
        }

        .btn-volver {
            display: block;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .btn-volver:hover {
            color: var(--blanco);
            text-decoration: underline;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚽</div>
        <h1>Actualidad Lamine</h1>
        <span class="fecha-destacada">Domingo, 22 de Febrero de 2026</span>

        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/noticias220226noche.html" class="contenedor-enlace">
            <img src="https://estaticos-cdn.prensaiberica.es/clip/35c77ac3-9fe3-405c-8124-994b1f919fa0_alta-libre-aspect-ratio_default_0_x800y299.jpg" alt="Lamine Yamal Noche" class="img-boton">
            <span class="btn-noticias">
                Gestos que dan que hablar <br>
                (22/02/26 por la noche)
            </span>
        </a>

        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/noticias220226tarde.html" class="contenedor-enlace">
            <img src="https://fotografias-2.larazon.es/clipping/cmsimages01/2026/02/22/53BFDEB3-322E-4242-86A1-0F0B4E5F5CD0/98.jpg?crop=4188,2356,x0,y218&width=1900&height=1069&optimize=low&format=webply" alt="Lamine Yamal Tarde" class="img-boton">
            <span class="btn-noticias">
                El Hartazgo de la Estrella <br>
                (22/02/26 por la tarde)
            </span>
        </a>

        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/noticias220226manana.html" class="contenedor-enlace">
            <img src="https://objetos-xlk.estaticos-marca.com/uploads/2026/02/19/6996a4ae390e2.jpeg" alt="Lamine Yamal Mañana" class="img-boton">
            <span class="btn-noticias">
                El jugador está VIVO y entrenando <br>
                (22/02/26 por la mañana)
            </span>
        </a>

        <section class="video-section" id="videos">
            <div class="container-video">
                <h2>Mis Vídeos de YouTube</h2>
                <a href="https://youtu.be/zj430jOVDNc" target="_blank" class="video-thumbnail-container">
                    <img src="https://i9.ytimg.com/vi/zj430jOVDNc/maxresdefault.jpg?v=69979a95&sqp=CIj07cwG&rs=AOn4CLDojJ_3YZPSPUJU1uMgt69ayt0lLQ" alt="Información Lamine Yamal">
                    <div class="play-overlay">
                        <i class="fas fa-play-circle"></i>
                    </div>
                </a>
                <p class="video-caption">Haz clic para ver mi historia en YouTube</p>
            </div>
        </section>

        <hr style="opacity: 0.1; margin: 2rem 0;">

        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/" class="btn-volver">
            &larr; Volver al inicio
        </a>
    </div>

</body>
</html>
