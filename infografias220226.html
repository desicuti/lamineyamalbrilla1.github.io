<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infografías de Lamine Yamal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos generales y fondo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #004d98 0%, #002d5a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            margin-bottom: 2rem;
        }

        /* Contenedor de botones */
        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 90%;
            max-width: 400px;
        }

        /* Estilo de los bloques */
        .card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: block;
        }

        .btn {
            background-color: #a50044;
            color: white;
            padding: 18px 25px;
            border-radius: 0 0 12px 12px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card:hover .btn {
            background-color: #db005a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .btn-back {
            background-color: transparent;
            border: 2px solid white;
            margin-top: 30px;
            font-size: 0.9rem;
            padding: 12px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: white;
            color: #004d98;
        }

        /* --- ESTILOS DEL POPUP --- */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .popup-content {
            background: white;
            color: #333;
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-header-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .popup-body {
            padding: 25px 30px 30px 30px;
        }

        .popup-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #a50044;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .popup-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .popup-input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .popup-submit {
            background: #004d98;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .popup-submit:hover {
            background: #a50044;
        }

        .close-popup {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Lamine Yamal: La Masía Brilla</h1>
    <p>Explora la trayectoria del joven talento</p>

    <div class="container">
        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/infografia_lamine.html" class="card">
            <img src="https://media-cldnry.s-nbcnews.com/image/upload/rockcms/2024-07/240710-Lionel-Messi-Lamine-Yamal-al-0931-214502.jpg" alt="Lamine Yamal e infancia">
            <span class="btn">Infancia de Lamine Yamal</span>
        </a>

        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/lycuriosidades.html" class="card">
            <img src="https://album.mediaset.es/eimg/2024/09/12/lamine-yamal_d2c3.jpg?w=1200&h=900" alt="Curiosidades Lamine Yamal">
            <span class="btn">Curiosidades sobre Lamine Yamal</span>
        </a>
        
        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/index.html" class="btn-back">
            Volver al inicio
        </a>
    </div>

    <div class="popup-overlay" id="infoPopup">
        <div class="popup-content">
            <span class="close-popup" onclick="closePopup()">&times;</span>
            <img src="https://www.fcbarcelona.com/fcbarcelona/photo/2025/05/27/9f68a451-d22b-48f0-a00d-9e816606b1c6/lamine-mans-obertes-gol.jpg" alt="Lamine Yamal Celebrando" class="popup-header-img">
            <div class="popup-body">
                <div class="popup-title">¡No te pierdas nada!</div>
                <p style="color: #666; font-size: 0.95rem;">Recibe nuevas infografías, fotos exclusivas y datos curiosos de Lamine cada semana.</p>
                
                <form id="popupForm" action="https://buttondown.com/api/emails/embed-subscribe/lamine_yamal_brilla" method="post" class="popup-form">
                    <input type="email" name="email" class="popup-input" placeholder="Tu mejor email..." required />
                    <button type="submit" class="popup-submit">¡Suscribirme!</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const popup = document.getElementById('infoPopup');

        function closePopup() {
            popup.style.display = 'none';
            localStorage.setItem('popupLamineVisto', 'true');
        }

        document.getElementById('popupForm').onsubmit = function() {
            localStorage.setItem('popupLamineVisto', 'true');
        };

        window.onload = function() {
            // Se ha cambiado el tiempo a 1000ms (1 segundo)
            if (!localStorage.getItem('popupLamineVisto')) {
                setTimeout(function() {
                    popup.style.display = 'flex';
                }, 1000); 
            }
        };
    </script>

</body>
</html>
