<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infografías de Lamine Yamal</title>
    <style>
        /* Estilos generales y fondo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #004d98 0%, #002d5a 100%); /* Azul profundo */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Contenedor de botones */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 400px;
        }

        /* Estilo de los botones */
        .btn {
            background-color: #a50044; /* Granate oficial */
            color: white;
            padding: 18px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Efecto al pasar el ratón */
        .btn:hover {
            background-color: #db005a;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        /* Botón de volver (especial) */
        .btn-back {
            background-color: transparent;
            border: 2px solid white;
            margin-top: 30px;
            font-size: 0.9rem;
            padding: 12px;
        }

        .btn-back:hover {
            background-color: white;
            color: #004d98;
        }
    </style>
</head>
<body>

    <h1>Lamine Yamal: La Masía Brilla</h1>
    <p>Explora la trayectoria del joven talento</p>

    <div class="container">
        <a href="#" class="btn">Infancia de Lamine Yamal</a>
        <a href="#" class="btn">Curiosidades sobre Lamine Yamal</a>
        
        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/index.html" class="btn btn-back">
            Volver al inicio
        </a>
    </div>

</body>
</html>
