<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos sobre Lamine Yamal</title>
    <style>
        /* Estilos generales y fondo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #004d98 0%, #002d5a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        /* Contenedor vacío */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
        }

        /* Botón de volver */
        .btn-back {
            background-color: transparent;
            border: 2px solid white;
            margin-top: 10px;
            font-size: 1rem;
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: white;
            color: #004d98;
            transform: scale(1.05);
        }

        /* --- ESTILOS DEL POPUP --- */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .popup-content {
            background: white;
            color: #333;
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-header-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .popup-body {
            padding: 25px 30px 30px 30px;
            text-align: center;
        }

        .popup-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #a50044;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .popup-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .popup-input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .popup-submit {
            background: #004d98;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .popup-submit:hover {
            background: #a50044;
        }

        .close-popup {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Juegos sobre Lamine Yamal</h1>
    <p>Disfruta y diviértete jugando</p>

    <div class="container">
        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/index.html" class="btn-back">
            Volver al Inicio
        </a>
    </div>

    <div class="popup-overlay" id="infoPopup">
        <div class="popup-content">
            <span class="close-popup" onclick="closePopup()">&times;</span>
            <img src="https://www.fcbarcelona.com/fcbarcelona/photo/2025/05/27/9f68a451-d22b-48f0-a00d-9e816606b1c6/lamine-mans-obertes-gol.jpg" alt="Lamine Yamal" class="popup-header-img">
            <div class="popup-body">
                <div class="popup-title">¡Próximamente más juegos!</div>
                <p style="color: #666; font-size: 0.95rem;">Estamos preparando retos increíbles. Suscríbete para ser el primero en jugar cuando los lancemos.</p>
                <form id="popupForm" action="https://buttondown.com/api/emails/embed-subscribe/lamine_yamal_brilla" method="post" class="popup-form">
                    <input type="email" name="email" class="popup-input" placeholder="Tu email para avisarte..." required />
                    <button type="submit" class="popup-submit">¡Avisadme!</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const popup = document.getElementById('infoPopup');

        function closePopup() {
            popup.style.display = 'none';
            localStorage.setItem('popupLamineVisto', 'true');
        }

        document.getElementById('popupForm').onsubmit = function() {
            localStorage.setItem('popupLamineVisto', 'true');
        };

        window.onload = function() {
            // El popup sale tras 1 segundo (1000ms)
            if (!localStorage.getItem('popupLamineVisto')) {
                setTimeout(function() {
                    popup.style.display = 'flex';
                }, 1000);
            }
        };
    </script>

</body>
</html>
