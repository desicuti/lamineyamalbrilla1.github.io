<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos sobre Lamine Yamal</title>
    <style>
        /* Estilos generales y fondo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #004d98 0%, #002d5a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        /* Contenedor vacío (por si añades juegos en el futuro) */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
        }

        /* Botón de volver */
        .btn-back {
            background-color: transparent;
            border: 2px solid white;
            margin-top: 10px;
            font-size: 1rem;
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: white;
            color: #004d98;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Juegos sobre Lamine Yamal</h1>
    <p>disfruta y diviértete jugando</p>

    <div class="container">
        <a href="https://desicuti.github.io/lamineyamalbrilla1.github.io/index.html" class="btn-back">
            Volver al Inicio
        </a>
    </div>

</body>
</html>
